[project]
name = "ribopipe"
version = "2.0.0"
description = "A lightweight sequence-based predictor of relative footprint density for within-sample imputation of low-coverage ribosome profiles"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{ name = "The RiboPipe Authors" }]
keywords = ["ribosome-profiling", "ribo-seq", "imputation", "translation", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "torch>=1.12"]

[project.optional-dependencies]
# ViennaRNA computes the folding-energy (MFE) tracks for new data (`ribopipe prepare`) and for the model analyses
# that recompute MFE after a sequence edit. Training and prediction on the released data do not need it.
mfe = ["ViennaRNA>=2.5"]
plot = ["matplotlib>=3.5"]
test = ["pytest"]
# scikit-learn is imported by the official RiboMIMO code (python -m baselines.run). RiboExp and RiboGL need a separate
# environment: requirements/gnn-baselines.txt.
baselines = ["scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/yaozhong/riboPipe"
Repository = "https://github.com/yaozhong/riboPipe"

[project.scripts]
ribopipe = "ribopipe.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ribopipe*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

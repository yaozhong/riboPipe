[project]
name = "ribopipe"
version = "1.2.1"
description = "Within-sample Ribo-seq imputation: predict codon-level pause profiles for low-coverage transcripts"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{ name = "The RiboPipe Authors" }]
keywords = ["ribosome-profiling", "ribo-seq", "imputation", "translation", "bioinformatics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch>=1.12",
    "biopython",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
# ViennaRNA is only needed to (re)generate the local-structure (MFE) feature cache
# used by the headline motif-CNN + BiGRU model. Training/prediction on an
# existing cache do not require it.
struct = ["ViennaRNA>=2.5"]
# Raw-read -> P-site -> codon-count CSV conversion (ribopipe raw2csv). Only needed to
# go from BAM to the package's input CSV; training/prediction on a CSV do not import it.
raw = ["pysam>=0.17"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/yaozhong/riboPipe"
Repository = "https://github.com/yaozhong/riboPipe"

[project.scripts]
ribopipe = "ribopipe.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ribopipe*"]
